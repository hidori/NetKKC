version: "2"

linters:
  default: all
  disable:
    - depguard
    - err113 # Comment out for production.
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gomodguard # Replaced by gomodguard_v2.
    - gosmopolitan
    - mnd
    - noinlineerr
    - testpackage
    - wsl
  settings:
    cyclop:
      max-complexity: 25
    exhaustive:
      default-signifies-exhaustive: true
    lll:
      line-length: 140
    varnamelen:
      ignore-decls:
        - i int
  exclusions:
    rules:
      - linters:
          - revive
        text: "package-comments"
      - linters: # Comment out for production.
          - revive
        text: "exported"
      - path: _test\.go
        linters:
          - goconst
          - varnamelen
