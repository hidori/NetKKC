openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: NetKKC API
  version: 0.1.0
  description: |
    Mozc を利用するステートレスなかな漢字変換 API。
    このファイルを API モデルとサーバーひな型のコード生成元とする。
    Go の生成器には oapi-codegen を使用し、Echo 用サーバーとモデルを生成する。
    生成器は OpenAPI 3.1 対応の oapi-codegen v2.8.0 に固定する。

    POST /convert で初回変換、POST /reconvert で文節を指定した再変換を処理する。
    空の読みは受け付けない。読みは文節をつなげた状態で UTF-8 の 4096 バイトまで。
    要求本文の上限は 1 MiB、変換処理の期限は15秒。
    examples は構造を示す例であり、Mozc の分割や候補順を保証しない。
paths:
  /healsh:
    get:
      operationId: getHealth
      summary: ヘルスチェック
      description: パスは /healsh。Hello, World! のエンドポイントは提供しない。
      responses:
        '200':
          description: サーバーが HTTP 要求に応答可能。
          content:
            text/plain:
              schema:
                type: string
                enum: [OK]
              example: OK
  /convert:
    post:
      operationId: convert
      summary: 読みを自動分割し、文節ごとのかな漢字候補に変換する
      description: |
        初回の変換。読みは加工せずに Mozc に渡し、Mozc の自動分割で文節に分ける。
        reading と max_candidates 以外のフィールド（segments など）は無視する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
            example:
              reading: きょうはとうきょうにいく
      responses:
        '200':
          $ref: '#/components/responses/Converted'
        default:
          $ref: '#/components/responses/Error'
  /reconvert:
    post:
      operationId: reconvert
      summary: 指定した文節境界と確定状態で再変換する
      description: |
        2 回目以降の変換。各文節の reading で文節境界を指定し、それらの連結を全体の読みとする。

        confirmed の省略・false は未確定として候補を生成し直す。
        未確定文節の要求内の candidates は使用しない。
        confirmed が true なら candidates に確定候補1件だけを要求し、
        その文節の読み・境界・確定候補を維持する。
        文節の確定順序に制約はなく、途中や末尾だけの確定も許容する。
        指定境界を処理できない場合は、自動分割に戻さずエラーにする。

        サーバーは前回の要求との一致を確認しない。
        確定候補が前回の応答に含まれていたかは照合しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconvertRequest'
            examples:
              reconvert:
                summary: 途中の文節だけを確定して再変換
                value:
                  segments:
                    - reading: きょうは
                    - reading: とうきょうに
                      confirmed: true
                      candidates: [東京に]
                    - reading: いく
                      confirmed: false
              ignoredCandidates:
                summary: 未確定文節の候補は送っても使用しない
                value:
                  segments:
                    - reading: いく
                      candidates: [行く]
      responses:
        '200':
          $ref: '#/components/responses/Converted'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Converted:
      description: 文節ごとの変換結果。全体の読みは各文節の reading の連結。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConvertResponse'
          example:
            segments:
              - reading: きょうは
                confirmed: false
                candidates: [今日は, 教派]
              - reading: とうきょうに
                confirmed: true
                candidates: [東京に]
              - reading: いく
                confirmed: false
                candidates: [行く, 逝く]
    Error:
      description: |
        400: JSON・フィールド型・読み・確定候補・文節境界の不整合。details に項目ごとの理由を含む場合がある。
        413: 要求本文が 1 MiB を超える。
        415: Content-Type が application/json ではない。
        422: 指定境界を実現できない（Mozc が読みを書き換えた場合を含む）。
        500: 想定外のエラー。
        502: Mozc の応答が不正（候補がないなど）。
        503: Mozc に接続できない、または変換に失敗した。
        504: 変換処理の期限超過・キャンセル。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: 不正な項目の位置（例 segments[1].candidates）。
        reason:
          type: string
    Reading:
      type: string
      minLength: 1
      description: |
        読み文字列。サーバーは加工しない。
        応答は Mozc が返した読みで、Mozc が書き換えた場合（全角英数字の半角化など）は要求と異なる。
        再変換は応答の読みを基準にする。
    Candidates:
      type: array
      description: 変換候補の文字列配列。
      items:
        type: string
    ConvertRequest:
      type: object
      required: [reading]
      properties:
        reading:
          $ref: '#/components/schemas/Reading'
        max_candidates:
          $ref: '#/components/schemas/MaxCandidates'
    ReconvertRequest:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          minItems: 1
          description: 読み順の文節。要求間の状態や候補全体を再送する必要はない。
          items:
            $ref: '#/components/schemas/SegmentRequest'
        max_candidates:
          $ref: '#/components/schemas/MaxCandidates'
    MaxCandidates:
      type: integer
      minimum: 1
      maximum: 1000
      default: 20
      description: |
        未確定文節ごとに返す候補の最大数。Mozc の候補順で先頭から返す。
        範囲外は入力エラー（400）。
    SegmentRequest:
      description: |
        未確定または確定済みの文節。
        confirmed が省略された場合は、候補数にかかわらず未確定として扱う。
      oneOf:
        - $ref: '#/components/schemas/UnconfirmedSegmentRequest'
        - $ref: '#/components/schemas/ConfirmedSegment'
    UnconfirmedSegmentRequest:
      type: object
      required: [reading]
      properties:
        reading:
          $ref: '#/components/schemas/Reading'
        confirmed:
          type: boolean
          enum: [false]
          default: false
          description: 省略と false は同義。読みと指定境界から候補を生成し直す。
        candidates:
          type: array
          description: |
            省略可能。送られても再変換には使用しない。
            1件だけでも確定済みとは扱わない。
          items:
            type: string
    ConfirmedSegment:
      type: object
      description: |
        確定済み文節。再要求と応答に共通の形式。
        candidates は確定した候補1件だけとし、候補一覧全体や別の text フィールドは不要。
        読み・境界・確定候補を維持し、新たな候補一覧は生成しない。
      required: [reading, confirmed, candidates]
      properties:
        reading:
          $ref: '#/components/schemas/Reading'
        confirmed:
          type: boolean
          enum: [true]
        candidates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
    ConvertResponse:
      type: object
      required: [segments]
      properties:
        segments:
          type: array
          description: 読み順の文節。各 reading の連結が全体の読み。
          items:
            $ref: '#/components/schemas/SegmentResponse'
    SegmentResponse:
      oneOf:
        - $ref: '#/components/schemas/UnconfirmedSegmentResponse'
        - $ref: '#/components/schemas/ConfirmedSegment'
    UnconfirmedSegmentResponse:
      type: object
      required: [reading, confirmed, candidates]
      properties:
        reading:
          $ref: '#/components/schemas/Reading'
        confirmed:
          type: boolean
          enum: [false]
        candidates:
          $ref: '#/components/schemas/Candidates'
