version: "2"

linters:
  default: all
  disable:
    - depguard
    - err113 # Comment out for production.
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gosmopolitan
    - mnd
    - noinlineerr
    - testpackage
    - wsl
  settings:
    lll:
      line-length: 140
    varnamelen:
      ignore-names:
        - i
      ignore-decls:
        - c echo.Context
        - e *echo.Echo
        - e *github.com/labstack/echo/v4.Echo
  exclusions:
    rules:
      - linters:
          - revive
        text: "package-comments"
      - path: _test\.go
        linters:
          - goconst
          - varnamelen
